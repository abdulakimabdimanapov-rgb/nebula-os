<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Nebula WebOS — операционная система в браузере. Один HTML-файл, чистый Vanilla JS, без библиотек." />
<title>Nebula WebOS</title>
<style>
/* ════════════════════════════════════════════════════════════
   NEBULA WEBOS — единый файл
   Glassmorphism + неоновый кибер-эстет, темы, обои, окна, док.
   ════════════════════════════════════════════════════════════ */

/* ─────────── Переменные и темы ─────────── */
:root, [data-theme="glass"] {
  --accent: #8b5cf6;
  --accent-2: #22d3ee;
  --glow: rgba(139, 92, 246, .45);
  --glass: rgba(255, 255, 255, .07);
  --glass-2: rgba(255, 255, 255, .13);
  --glass-3: rgba(20, 24, 48, .55);
  --border: rgba(255, 255, 255, .14);
  --text: #eef0ff;
  --text-dim: rgba(238, 240, 255, .6);
  --danger: #ff5f57;
  --warn: #febc2e;
  --ok: #28c840;
  --dock-h: 64px;
  --radius: 16px;
  --shadow: 0 24px 60px -12px rgba(0, 0, 0, .55);
  --mono: 'SF Mono', ui-monospace, Menlo, Consolas, 'Cascadia Code', monospace;
  color-scheme: dark;
}

[data-theme="cyber"] {
  --accent: #ff2d95;
  --accent-2: #17e9ff;
  --glow: rgba(255, 45, 149, .5);
  --glass: rgba(30, 8, 42, .34);
  --glass-2: rgba(255, 255, 255, .1);
  --glass-3: rgba(24, 6, 34, .6);
  --border: rgba(255, 255, 255, .18);
  --text: #f6f2ff;
  --text-dim: rgba(246, 242, 255, .62);
}

[data-theme="light"] {
  --accent: #7c3aed;
  --accent-2: #0ea5e9;
  --glow: rgba(124, 58, 237, .35);
  --glass: rgba(255, 255, 255, .52);
  --glass-2: rgba(255, 255, 255, .72);
  --glass-3: rgba(255, 255, 255, .8);
  --border: rgba(15, 23, 42, .14);
  --text: #1e293b;
  --text-dim: rgba(30, 41, 59, .62);
  --shadow: 0 24px 60px -16px rgba(15, 23, 42, .35);
  color-scheme: light;
}

[data-theme="dark"] {
  --accent: #60a5fa;
  --accent-2: #34d399;
  --glow: rgba(96, 165, 250, .4);
  --glass: rgba(12, 16, 26, .6);
  --glass-2: rgba(255, 255, 255, .1);
  --glass-3: rgba(10, 13, 22, .75);
  --border: rgba(255, 255, 255, .12);
  --text: #e6ecf5;
  --text-dim: rgba(230, 236, 245, .58);
}

/* ─────────── База ─────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  background: #070812;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--glass-2); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--glow); }

/* ─────────── Рабочий стол ─────────── */
#desktop { position: fixed; inset: 0; overflow: hidden; }

/* Живой canvas-фон (частицы) */
#bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

/* Цветовая подложка обоев (слои градиентов поверх частиц) */
#wallpaper-tint {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(160deg, rgba(8, 10, 30, .5), rgba(30, 16, 60, .3) 50%, rgba(8, 30, 60, .4));
  transition: background .8s ease;
  pointer-events: none;
}
#desktop[data-wallpaper="cyber"] #wallpaper-tint {
  background: linear-gradient(155deg, rgba(40, 4, 44, .62), rgba(70, 8, 60, .42) 45%, rgba(8, 60, 70, .5));
}
#desktop[data-wallpaper="minimal"] #wallpaper-tint {
  background: linear-gradient(160deg, rgba(10, 12, 16, .66), rgba(24, 26, 34, .5) 50%, rgba(14, 16, 24, .6));
}
#desktop[data-wallpaper="mountains"] #wallpaper-tint {
  background: linear-gradient(165deg, rgba(6, 28, 40, .5), rgba(14, 46, 60, .35) 40%, rgba(80, 40, 90, .3) 75%, rgba(200, 120, 60, .25));
}
[data-theme="light"] #wallpaper-tint { opacity: .25; }
[data-theme="light"] #desktop { background: #dfe7f5; }

/* ─────────── Экран загрузки ─────────── */
#boot {
  position: fixed; inset: 0; z-index: 10000;
  display: grid; place-items: center;
  background: radial-gradient(80% 80% at 50% 40%, #10122a, #070812 75%);
  transition: opacity .6s ease, visibility .6s ease;
}
#boot.hide { opacity: 0; visibility: hidden; }
.boot-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.boot-logo {
  font-size: 64px; color: var(--accent);
  text-shadow: 0 0 34px var(--glow), 0 0 70px var(--glow);
  animation: logoPulse 1.5s ease-in-out infinite;
}
@keyframes logoPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .8; } }
.boot-title { font-size: 20px; letter-spacing: 12px; font-weight: 700; text-indent: 12px; }
.boot-title span { color: var(--accent); }
.boot-bar { width: 220px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px var(--glow); animation: bootLoad 1.5s cubic-bezier(.3,.7,.3,1) forwards; }
@keyframes bootLoad { to { width: 100%; } }
.boot-hint { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }

.boot-langs {
  display: flex; gap: 10px; margin-top: 4px;
}
.boot-lang {
  width: 38px; height: 30px; border-radius: 9px;
  display: grid; place-items: center;
  font-size: 17px; line-height: 1;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .14);
  color: var(--text);
  cursor: pointer;
  transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.boot-lang:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .14); }
.boot-lang.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 28%, transparent);
  box-shadow: 0 0 14px var(--accent-glow);
}

/* ─────────── Иконки рабочего стола ─────────── */
#desktop-icons {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start;
  gap: 14px; padding: 18px 14px;
  pointer-events: none;
}
.d-icon {
  pointer-events: auto;
  width: 86px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 4px 6px;
  border-radius: 12px;
  border: 1px solid transparent;
  cursor: default;
  transition: background .12s ease, border-color .12s ease, transform .12s ease;
}
.d-icon .di-emoji {
  font-size: 34px; line-height: 1;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
  transition: transform .15s cubic-bezier(.34,1.56,.64,1);
}
.d-icon .di-name {
  font-size: 11px; color: #eef0ff; text-align: center; line-height: 1.25;
  text-shadow: 0 1px 4px rgba(0,0,0,.8);
  max-width: 82px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.d-icon:hover { background: rgba(255,255,255,.12); }
.d-icon:hover .di-emoji { transform: translateY(-4px) scale(1.12); }
.d-icon.selected { background: rgba(139,92,246,.22); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -6px var(--glow); }
[data-theme="light"] .d-icon .di-name { color: #1e293b; text-shadow: none; }

/* ─────────── Окна ─────────── */
#windows-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

.window {
  position: absolute;
  pointer-events: auto;
  display: flex; flex-direction: column;
  min-width: 300px; min-height: 200px;
  max-width: calc(100vw - 16px); max-height: calc(100vh - var(--dock-h) - 24px);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(165deg, var(--glass-2), var(--glass));
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow: var(--shadow);
  overflow: hidden;
  opacity: 0;
  animation: winIn .28s cubic-bezier(.2,.9,.32,1.12) forwards;
  transition: opacity .22s ease, transform .22s ease, visibility .22s;
}
.window.is-focused {
  border-color: rgba(255,255,255,.28);
  box-shadow:
    0 0 0 1px var(--glow),
    0 0 44px -8px var(--glow),
    0 34px 80px -14px rgba(0,0,0,.65);
}
@keyframes winIn { from { opacity: 0; transform: scale(.9) translateY(18px); filter: blur(6px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
.window.is-closing { animation: winOut .2s ease forwards; pointer-events: none; }
@keyframes winOut { to { opacity: 0; transform: scale(.88) translateY(16px); filter: blur(8px); } }
.window.is-minimized {
  transform: scale(.55) translateY(90px);
  opacity: 0; visibility: hidden;
  transition: transform .24s ease, opacity .24s ease, visibility .24s;
  animation: none;
}
.window.is-maximized { border-radius: 0; border-left: none; border-right: none; border-top: none; }

.win-header {
  flex: 0 0 40px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 8px 0 14px;
  cursor: default;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.045), transparent);
  touch-action: none;
}
.win-title {
  display: flex; align-items: center; gap: 8px;
  flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 13.5px; font-weight: 600; letter-spacing: .2px;
}
.win-title .w-ico { font-size: 15px; filter: drop-shadow(0 0 6px var(--glow)); }
.win-controls { display: flex; gap: 7px; }
.win-ctl {
  width: 13px; height: 13px; border-radius: 50%;
  position: relative;
  display: grid; place-items: center;
  color: rgba(0,0,0,.65); font-size: 10px; line-height: 1;
  transition: transform .15s ease, filter .15s ease;
}
.win-ctl:hover { transform: scale(1.25); filter: brightness(1.15); }
.win-ctl:active { transform: scale(.9); }
.win-ctl.close { background: var(--danger); }
.win-ctl.min { background: var(--warn); }
.win-ctl.max { background: var(--ok); }
.win-ctl::after { content: ''; opacity: 0; transition: opacity .12s ease; }
.win-ctl.close::after { content: '×'; }
.win-ctl.min::after { content: '–'; font-weight: 700; }
.win-ctl.max::after { content: '+'; font-weight: 700; }
.win-controls:hover .win-ctl::after { opacity: 1; }

.win-body { flex: 1; overflow: auto; display: flex; flex-direction: column; min-height: 0; }

/* Ресайз-хендл (нижний правый угол) */
.win-resize {
  position: absolute; right: 0; bottom: 0;
  width: 18px; height: 18px;
  cursor: nwse-resize;
  z-index: 5;
  touch-action: none;
}
.win-resize::after {
  content: '';
  position: absolute; right: 4px; bottom: 4px;
  width: 7px; height: 7px;
  border-right: 2px solid var(--text-dim);
  border-bottom: 2px solid var(--text-dim);
  border-bottom-right-radius: 3px;
  opacity: .55;
}
.window.is-maximized .win-resize { display: none; }

/* ─────────── Dock / панель задач ─────────── */
#dock {
  position: fixed;
  left: 50%; bottom: 12px;
  transform: translateX(-50%);
  z-index: 5000;
  height: var(--dock-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 10px;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-2), var(--glass));
  backdrop-filter: blur(28px) saturate(170%);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  box-shadow: 0 22px 50px -14px rgba(0,0,0,.6);
  animation: dockUp .6s .15s cubic-bezier(.2,.9,.3,1.1) backwards;
}
@keyframes dockUp { from { opacity: 0; transform: translate(-50%, 44px); } to { opacity: 1; transform: translate(-50%, 0); } }

#start-btn {
  width: 44px; height: 44px; flex: 0 0 auto;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--glass);
  font-size: 22px; color: var(--accent);
  display: grid; place-items: center;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, background .2s ease;
  text-shadow: 0 0 12px var(--glow);
}
#start-btn:hover { transform: translateY(-3px) scale(1.08); background: var(--glass-2); box-shadow: 0 10px 22px -8px var(--glow); }
#start-btn.active { transform: translateY(-2px) scale(1.05); background: var(--glass-2); }

.dock-sep { width: 1px; height: 38px; background: linear-gradient(180deg, transparent, var(--border), transparent); flex: 0 0 auto; }

#dock-icons { display: flex; gap: 9px; align-items: center; }
.dock-icon {
  position: relative;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  font-size: 24px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--glass);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, background .22s ease;
}
.dock-icon:hover { transform: translateY(-8px) scale(1.12); background: var(--glass-2); box-shadow: 0 12px 24px -8px var(--glow), 0 0 20px -4px var(--glow); }
.dock-icon:active { transform: translateY(-4px) scale(1.04); }
.dock-icon .tip {
  position: absolute; top: -32px; left: 50%;
  transform: translateX(-50%) scale(.9);
  padding: 4px 10px; font-size: 11.5px; white-space: nowrap;
  border-radius: 8px;
  background: rgba(10, 12, 24, .9);
  border: 1px solid var(--border);
  color: var(--text);
  opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
}
.dock-icon:hover .tip { opacity: 1; transform: translateX(-50%) scale(1); }
.dock-icon .dot {
  position: absolute; bottom: 3px; left: 50%;
  width: 5px; height: 5px; border-radius: 50%;
  transform: translateX(-50%);
  background: var(--text-dim);
  opacity: 0;
  transition: opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
.dock-icon.is-open .dot { opacity: 1; }
.dock-icon.is-active .dot { background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
.dock-icon.is-min { filter: grayscale(.55) brightness(.82); }

/* Системный трей */
#tray { display: flex; align-items: center; gap: 4px; margin-left: 6px; }
.tray-btn {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  font-size: 17px;
  border: 1px solid transparent;
  transition: background .15s ease, transform .15s ease, border-color .15s ease;
  position: relative;
}
.tray-btn:hover { background: var(--glass-2); border-color: var(--border); transform: translateY(-1px); }
.tray-btn.off { opacity: .5; }

/* Попап громкости */
#vol-pop {
  position: fixed; bottom: calc(var(--dock-h) + 24px); left: 50%;
  transform: translateX(-50%) translateY(8px) scale(.96);
  z-index: 5100;
  padding: 14px 16px;
  min-width: 240px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-3), var(--glass));
  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  box-shadow: 0 18px 44px -10px rgba(0,0,0,.55);
  display: flex; flex-direction: column; gap: 10px;
  opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
}
#vol-pop.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
.vol-row { display: flex; align-items: center; gap: 10px; }
.vol-row .vol-ico { font-size: 18px; width: 24px; text-align: center; }
.vol-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.vol-mute {
  font-size: 12px; padding: 6px 10px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--glass);
  transition: background .15s ease;
}
.vol-mute:hover { background: var(--glass-2); }
.vol-test { font-size: 12px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--glass); transition: background .15s ease; }
.vol-test:hover { background: var(--glass-2); }

/* Часы в трее */
#tray-clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; margin-left: 8px; min-width: 92px; }
#clock-time { font-size: 15px; font-weight: 700; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
#clock-date { font-size: 10.5px; color: var(--text-dim); }

/* ─────────── Меню «Пуск» ─────────── */
#start-menu {
  position: fixed;
  left: 50%; bottom: calc(var(--dock-h) + 28px);
  transform: translateX(-50%) translateY(16px) scale(.96);
  z-index: 5100;
  width: min(380px, 94vw);
  max-height: calc(100vh - var(--dock-h) - 44px);
  overflow-y: auto;
  padding: 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-3), var(--glass));
  backdrop-filter: blur(30px) saturate(170%);
  -webkit-backdrop-filter: blur(30px) saturate(170%);
  box-shadow: 0 30px 70px -18px rgba(0,0,0,.65);
  display: flex; flex-direction: column; gap: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
#start-menu.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }

.sm-user { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.sm-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 19px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 18px -6px var(--glow);
}
.sm-user .sm-name { font-size: 14px; font-weight: 700; }
.sm-user .sm-sub { font-size: 11.5px; color: var(--text-dim); }

.sm-sec-title { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-dim); }

.sm-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sm-stat { padding: 8px 10px; border-radius: 11px; border: 1px solid var(--border); background: var(--glass); }
.sm-stat .smk { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; }
.sm-stat .smv { font-size: 12.5px; font-weight: 600; margin-top: 3px; }
.sm-ram { grid-column: 1 / -1; }
.ram-bar { height: 5px; border-radius: 3px; background: var(--glass-2); overflow: hidden; margin-top: 6px; }
.ram-bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }

.sm-apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sm-app {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px; border-radius: 13px;
  border: 1px solid transparent;
  transition: background .14s ease, border-color .14s ease, transform .14s ease;
}
.sm-app:hover { background: var(--glass-2); border-color: var(--border); transform: translateY(-2px); }
.sm-app .sa-ico { font-size: 25px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
.sm-app .sa-name { font-size: 11px; text-align: center; }

.sm-foot { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
.sm-btn {
  flex: 1; padding: 9px 10px; border-radius: 11px;
  font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--glass);
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .15s ease, transform .15s ease, color .15s ease;
}
.sm-btn:hover { background: var(--glass-2); }
.sm-btn.reboot:hover { color: var(--danger); border-color: var(--danger); transform: scale(1.02); }

/* ─────────── Контекстное меню ─────────── */
#ctx-menu {
  position: fixed; z-index: 9000;
  min-width: 210px; padding: 6px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-3), var(--glass));
  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  box-shadow: 0 18px 44px -10px rgba(0,0,0,.55);
  opacity: 0; pointer-events: none;
  transform: scale(.94) translateY(4px);
  transform-origin: top left;
  transition: opacity .13s ease, transform .13s ease;
}
#ctx-menu.show { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
.ctx-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; font-size: 13px; border-radius: 8px;
  cursor: pointer;
  transition: background .12s ease;
}
.ctx-item:hover { background: var(--glow); }
.ctx-item .ctx-ico { font-size: 14px; }
.ctx-sep { height: 1px; margin: 6px 8px; background: var(--border); }

/* ─────────── Приложение: Заметки ─────────── */
.app-notes { display: flex; flex-direction: column; height: 100%; }
.notes-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.notes-bar input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font: inherit; font-weight: 600; font-size: 14px;
}
.notes-bar input::placeholder { color: var(--text-dim); font-weight: 400; }
.notes-status { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.notes-clear {
  border: 1px solid var(--border); background: var(--glass);
  color: var(--text-dim); font-size: 12px;
  padding: 5px 10px; border-radius: 9px;
  transition: color .15s ease, border-color .15s ease, transform .15s ease;
}
.notes-clear:hover { color: var(--danger); border-color: var(--danger); transform: scale(1.04); }
.notes-body {
  flex: 1; resize: none; border: none; outline: none;
  background: transparent; color: var(--text);
  font-family: var(--mono); font-size: 14px; line-height: 1.65;
  padding: 14px 16px;
}
.notes-body::placeholder { color: var(--text-dim); }
.notes-count { padding: 7px 14px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); }

/* ─────────── Приложение: Терминал ─────────── */
.app-term {
  position: relative;
  display: flex; flex-direction: column; flex: 1; min-height: 0;
  background: rgba(4, 8, 16, .86);
  font-family: var(--mono); font-size: 13.5px;
  color: #c9ffe0;
}
.term-out { flex: 1; overflow-y: auto; padding: 14px 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.term-line { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-top: 1px solid rgba(255,255,255,.06); }
.term-prompt { color: #22e0b0; font-weight: 600; white-space: nowrap; }
.term-input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: inherit; font: inherit; caret-color: #22e0b0; }
.term-matrix {
  position: absolute; inset: 0; z-index: 6;
  width: 100%; height: 100%;
  background: rgba(2, 8, 4, .92);
  display: none;
}
.term-matrix.on { display: block; }
.t-ok { color: #6bffa3; }
.t-err { color: #ff7a8a; }
.t-dim { color: #7f93b8; }
.t-acc { color: #22e0b0; }
.t-ac2 { color: #ff8ad1; }
.t-neon { color: #3cffb0; text-shadow: 0 0 10px rgba(60,255,176,.6); }

/* ─────────── Приложение: Калькулятор ─────────── */
.app-calc { display: flex; flex: 1; min-height: 0; }
.calc-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.calc-screen {
  flex: 0 0 84px;
  display: flex; flex-direction: column;
  align-items: flex-end; justify-content: flex-end;
  padding: 12px 16px; gap: 3px;
  overflow: hidden;
}
.calc-expr { font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.calc-current { font-size: 32px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calc-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 8px; padding: 4px 12px 14px; }
.calc-btn {
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--glass); color: var(--text); font-size: 18px;
  transition: transform .1s ease, background .14s ease, box-shadow .14s ease;
}
.calc-btn:hover { background: var(--glass-2); transform: translateY(-1px); }
.calc-btn:active { transform: scale(.93); }
.calc-btn.op { color: var(--accent-2); font-weight: 600; }
.calc-btn.danger { color: var(--danger); }
.calc-btn.fn { color: var(--accent); font-weight: 600; }
.calc-btn.eq { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 700; box-shadow: 0 8px 20px -6px var(--glow); }
.calc-btn.zero { grid-column: span 2; }
.calc-hist {
  width: 128px; flex: 0 0 auto;
  border-left: 1px solid var(--border);
  background: var(--glass);
  display: flex; flex-direction: column;
  transition: width .2s ease, opacity .2s ease;
  overflow: hidden;
}
.calc-hist.hidden { width: 0; opacity: 0; border-left: none; }
.calc-hist h4 { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); padding: 12px 12px 6px; }
.calc-hist-list { flex: 1; overflow-y: auto; padding: 0 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.hist-item {
  font-family: var(--mono); font-size: 11.5px;
  padding: 6px 8px; border-radius: 8px;
  background: var(--glass-2); cursor: pointer;
  transition: background .12s ease;
}
.hist-item:hover { background: var(--glow); }
.hist-item .hi-expr { color: var(--text-dim); }
.hist-item .hi-res { color: var(--text); font-weight: 700; }
.calc-hist-btn { border: 1px solid var(--border); background: var(--glass); font-size: 13px; padding: 4px 9px; border-radius: 8px; color: var(--text-dim); transition: color .15s ease, border-color .15s ease; }
.calc-hist-btn:hover { color: var(--accent-2); border-color: var(--accent-2); }

/* ─────────── Приложение: Настройки ─────────── */
.app-settings { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }
.settings-sec { display: flex; flex-direction: column; gap: 10px; }
.settings-sec h3 { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-dim); }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.opt-card {
  border: 1px solid var(--border); border-radius: 13px;
  background: var(--glass); padding: 8px; cursor: pointer; text-align: left;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.opt-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.opt-card.is-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 24px -8px var(--glow); }
.opt-preview { height: 50px; border-radius: 9px; margin-bottom: 7px; border: 1px solid var(--border); }
.opt-name { font-size: 12.5px; font-weight: 600; display: block; }
.opt-desc { font-size: 10.5px; color: var(--text-dim); display: block; margin-top: 2px; }
.vol-ctl { display: flex; align-items: center; gap: 12px; }
.vol-ctl .vol-ico { font-size: 20px; }
.vol-ctl input[type="range"] { flex: 1; accent-color: var(--accent); }
.theme-quick { display: flex; gap: 8px; }
.tq-btn {
  flex: 1; padding: 10px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--glass);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 600;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.tq-btn:hover { background: var(--glass-2); border-color: var(--accent); transform: translateY(-2px); }
.settings-reset { align-self: flex-start; border: 1px solid var(--border); background: var(--glass); color: var(--text); font-size: 13px; padding: 8px 16px; border-radius: 11px; transition: transform .15s ease, border-color .15s ease, color .15s ease; }
.settings-reset:hover { border-color: var(--danger); color: var(--danger); transform: scale(1.03); }

/* ─────────── Приложение: Музыка ─────────── */
.app-music { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.music-head { padding: 14px 16px 8px; }
.music-title { font-size: 15px; font-weight: 700; }
.music-artist { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.music-viz {
  flex: 0 0 96px; margin: 8px 16px 4px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: rgba(6, 10, 20, .5);
}
.music-progress { display: flex; align-items: center; gap: 10px; padding: 6px 16px; font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.music-progress .mp-bar { flex: 1; height: 4px; border-radius: 3px; background: var(--glass-2); overflow: hidden; }
.music-progress .mp-bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.music-controls { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 16px; }
.mc-btn {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; font-size: 17px;
  border: 1px solid var(--border); background: var(--glass);
  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
}
.mc-btn:hover { background: var(--glass-2); transform: scale(1.1); box-shadow: 0 6px 16px -6px var(--glow); }
.mc-btn:active { transform: scale(.92); }
.mc-btn.play { width: 54px; height: 54px; font-size: 21px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 10px 24px -8px var(--glow); }
.music-list { padding: 6px 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.m-track {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 11px;
  border: 1px solid transparent; cursor: pointer;
  transition: background .13s ease, border-color .13s ease;
}
.m-track:hover { background: var(--glass-2); }
.m-track.active { background: var(--glass-2); border-color: var(--accent); }
.m-track .mt-ico { font-size: 17px; }
.m-track .mt-name { flex: 1; font-size: 12.5px; font-weight: 600; }
.m-track .mt-dur { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* ─────────── Приложение: Файлы ─────────── */
.app-files { display: flex; flex: 1; min-height: 0; }
.files-side {
  width: 150px; flex: 0 0 auto;
  border-right: 1px solid var(--border);
  padding: 10px 8px;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--glass);
}
.fs-nav { display: flex; align-items: center; gap: 6px; padding: 8px; font-size: 12px; font-weight: 600; border-radius: 9px; cursor: pointer; transition: background .13s ease; }
.fs-nav:hover { background: var(--glass-2); }
.fs-nav.disabled { opacity: .4; pointer-events: none; }
.fs-folder {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; font-size: 12.5px; border-radius: 9px;
  cursor: pointer; border: 1px solid transparent;
  transition: background .13s ease, border-color .13s ease;
}
.fs-folder:hover { background: var(--glass-2); }
.fs-folder.active { background: var(--glass-2); border-color: var(--accent); }
.files-main { flex: 1; padding: 12px; overflow-y: auto; }
.files-path { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; font-family: var(--mono); }
.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.f-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 6px 8px; border-radius: 12px;
  border: 1px solid transparent; cursor: pointer;
  transition: background .13s ease, border-color .13s ease, transform .13s ease;
  text-align: center;
}
.f-item:hover { background: var(--glass-2); border-color: var(--border); transform: translateY(-2px); }
.f-item.selected { background: var(--glow); border-color: var(--accent); }
.f-item .fi-ico { font-size: 30px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
.f-item .fi-name { font-size: 11px; max-width: 82px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; }

/* ─────────── Приложение: Просмотрщик ─────────── */
.app-viewer { flex: 1; overflow: auto; display: grid; place-items: center; padding: 16px; }
.app-viewer pre {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  color: var(--text); white-space: pre-wrap; word-break: break-word;
  max-width: 100%;
}
.app-viewer img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 12px 34px -10px rgba(0,0,0,.55); }

/* ─────────── Служебное ─────────── */
.dragging { cursor: grabbing !important; }
.dragging * { cursor: grabbing !important; }
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Адаптивность */
@media (max-width: 720px) {
  #dock { padding: 0 6px; gap: 6px; }
  .dock-icon { width: 40px; height: 40px; font-size: 20px; }
  #start-btn { width: 40px; height: 40px; }
  .tray-btn { width: 34px; height: 34px; font-size: 15px; }
  #clock-date { display: none; }
  .d-icon { width: 72px; }
  .d-icon .di-emoji { font-size: 28px; }
}
@media (max-width: 520px) {
  .dock-icon .tip { display: none; }
  #clock-time { font-size: 13px; }
}

/* ═══════════ ПОРТ: эффекты обоев, приложения, уведомления ═══════════ */

/* ─── Обои «Природа» ─── */
#desktop[data-wallpaper="nature"] #wallpaper-tint {
  background: linear-gradient(170deg, rgba(3, 20, 12, .6), rgba(11, 47, 29, .42) 45%, rgba(47, 133, 90, .35));
}

/* ─── Живые эффекты обоев: звёзды / неон / листва (наполняет script) ─── */
.wallpaper-fx {
  position: absolute; inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}
.wallpaper-fx i { position: absolute; display: block; }

.wallpaper-fx .fx-star {
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, 0) 70%);
  box-shadow: 0 0 6px 1px rgba(255, 255, 255, .5);
  animation: starTwinkle var(--d, 3.2s) ease-in-out var(--delay, 0s) infinite;
}
@keyframes starTwinkle {
  0%, 100% { opacity: .12; transform: scale(.7); }
  50%      { opacity: 1;   transform: scale(1.3); }
}

.wallpaper-fx .fx-grid {
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 45, 149, .10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23, 233, 255, .10) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .35) 40%, rgba(0, 0, 0, .85) 100%);
  mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .35) 40%, rgba(0, 0, 0, .85) 100%);
  animation: gridShift 16s linear infinite;
}
@keyframes gridShift {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 0 44px, 44px 0; }
}

.wallpaper-fx .fx-orb {
  width: 34vmax; height: 34vmax;
  border-radius: 50%;
  filter: blur(52px);
  animation: orbPulse var(--d, 6s) ease-in-out var(--delay, 0s) infinite;
}
@keyframes orbPulse {
  0%, 100% { opacity: .22; transform: scale(1); }
  50%      { opacity: .65; transform: scale(1.16); }
}

.wallpaper-fx .fx-sweep {
  top: -25%; bottom: -25%;
  width: 24vmax;
  transform: skewX(-16deg);
  background: linear-gradient(90deg, transparent, rgba(23, 233, 255, .09) 40%, rgba(255, 45, 149, .12) 60%, transparent);
  animation: neonSweep 12s ease-in-out var(--delay, 0s) infinite;
}
@keyframes neonSweep {
  0%        { left: -35%; opacity: 0; }
  10%       { opacity: 1; }
  48%       { left: 110%; opacity: 1; }
  62%, 100% { left: 110%; opacity: 0; }
}

.wallpaper-fx .fx-leaf {
  top: 0;
  width: 9px; height: 9px;
  border-radius: 80% 10% 80% 10%;
  background: linear-gradient(135deg, #8bf0ae, #2f855a);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
  animation: leafFall var(--d, 12s) linear var(--delay, 0s) infinite;
}
@keyframes leafFall {
  0%   { transform: translate3d(0, -6vh, 0) rotate(0deg);   opacity: 0; }
  6%   { opacity: .65; }
  50%  { transform: translate3d(var(--sway, 20px), 52vh, 0) rotate(180deg); opacity: .55; }
  94%  { opacity: .5; }
  100% { transform: translate3d(calc(var(--sway, 20px) * -0.8), 108vh, 0) rotate(360deg); opacity: 0; }
}

/* ─── Приложение: О системе ─── */
.app-about {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 20px; text-align: center;
}
.about-logo { font-size: 52px; color: var(--accent); text-shadow: 0 0 30px var(--glow); }
.about-title { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.about-title span { color: var(--accent); }
.about-ver { font-size: 12px; color: var(--text-dim); }
.about-desc { font-size: 12.5px; color: var(--text-dim); max-width: 260px; line-height: 1.55; }

/* ─── Приложение: Файлы (полная версия) ─── */
.app-files {
  position: relative;
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
  background: rgba(8, 10, 20, .38);
}
.files-toolbar {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, .03);
}
.files-nav, .files-actions { display: flex; gap: 6px; }
.fbtn {
  border: 1px solid var(--border);
  background: var(--glass);
  color: var(--text);
  font: inherit; font-size: 12px;
  padding: 6px 10px;
  border-radius: 9px;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .12s ease;
}
.fbtn:hover { background: var(--glass-2); border-color: var(--accent); }
.fbtn:active { transform: scale(.94); }
.fbtn:disabled { opacity: .35; cursor: default; pointer-events: none; }
.fbtn.danger { color: var(--danger); border-color: rgba(255, 93, 115, .5); }
.fbtn.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
.files-path {
  flex: 1; min-width: 120px;
  display: flex; align-items: center; gap: 2px;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: rgba(0, 0, 0, .28);
  overflow-x: auto;
  white-space: nowrap;
}
.files-path::-webkit-scrollbar { height: 4px; }
.crumb {
  border: none; background: transparent;
  color: var(--text-dim);
  font: inherit; font-size: 12.5px;
  padding: 2px 6px; border-radius: 6px;
  cursor: pointer;
  transition: color .12s ease, background .12s ease;
}
.crumb:hover { color: var(--accent-2); background: var(--glass); }
.crumb-sep { color: var(--text-dim); opacity: .45; }
.files-area {
  flex: 1; min-height: 0;
  position: relative;
  overflow-y: auto;
  padding: 14px;
}
.files-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 6px;
  align-content: start;
}
.files-grid.list { grid-template-columns: 1fr; gap: 2px; }
.files-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 6px 10px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  font: inherit; text-align: center;
  cursor: default;
  transition: background .14s ease, border-color .14s ease, transform .14s ease;
}
.files-item:hover { background: rgba(255, 255, 255, .07); border-color: var(--border); }
.files-item.selected { background: var(--glow); border-color: var(--accent); }
.files-item:focus-visible { outline: 1px solid var(--accent-2); outline-offset: -1px; }
.files-grid.list .files-item { flex-direction: row; gap: 10px; padding: 7px 12px; text-align: left; }
.fi-ico { font-size: 32px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .4)); }
.files-grid.list .fi-ico { font-size: 19px; }
.fi-name {
  font-size: 12px; line-height: 1.3;
  max-width: 100%;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.files-grid.list .fi-name { flex: 1; -webkit-line-clamp: 1; }
.fi-meta { font-size: 10.5px; color: var(--text-dim); }
.files-grid.list .fi-meta { min-width: 70px; text-align: right; }
.files-empty {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--text-dim); font-size: 13px;
  letter-spacing: .4px;
  pointer-events: none;
}
.files-status {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 7px 14px;
  font-size: 11px; color: var(--text-dim);
  border-top: 1px solid var(--border);
  background: rgba(255, 255, 255, .02);
}
.files-rename {
  width: 100%;
  border: 1px solid var(--accent);
  border-radius: 7px;
  background: rgba(0, 0, 0, .5);
  color: var(--text);
  font: inherit; font-size: 12px;
  padding: 3px 6px;
  outline: none;
}
.files-grid.list .files-rename { width: 240px; }
.files-overlay {
  position: absolute; inset: 0;
  z-index: 20;
  display: grid; place-items: center;
  background: rgba(4, 6, 14, .55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.files-editor {
  width: min(540px, calc(100% - 36px));
  height: min(360px, calc(100% - 56px));
  display: flex; flex-direction: column;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-2), var(--glass));
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 26px 60px -12px rgba(0, 0, 0, .6);
  overflow: hidden;
  animation: winIn .22s ease;
}
.files-editor-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px 8px 14px;
  border-bottom: 1px solid var(--border);
}
.fe-title { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fe-controls { display: flex; gap: 6px; }
.fe-body {
  flex: 1; min-height: 0;
  resize: none;
  border: none; outline: none;
  background: rgba(5, 8, 16, .6);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px; line-height: 1.6;
  padding: 12px 14px;
}
.files-confirm {
  width: min(340px, calc(100% - 36px));
  border-radius: 14px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-2), var(--glass));
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 26px 60px -12px rgba(0, 0, 0, .6);
  padding: 18px;
  animation: winIn .2s ease;
}
.fc-text { font-size: 13.5px; line-height: 1.55; margin-bottom: 16px; }
.fc-text b { color: var(--text); }
.fc-btns { display: flex; justify-content: flex-end; gap: 8px; }
.files-toast {
  position: absolute;
  left: 50%; bottom: 46px;
  transform: translateX(-50%) translateY(8px);
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 12.5px;
  background: rgba(10, 12, 24, .92);
  border: 1px solid var(--border);
  box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .5);
  color: var(--text);
  opacity: 0;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 30;
  pointer-events: none;
  max-width: 80%;
}
.files-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.files-toast.err { border-color: var(--danger); color: #ffb3bd; }
.files-toast.ok { border-color: #34d399; color: #b6f7d6; }

/* ─── Приложение: Музыка (полная версия) ─── */
.app-music {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
  background: rgba(8, 10, 20, .38);
}
.music-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 14px 16px 6px;
}
.music-title { font-size: 15px; font-weight: 700; }
.music-artist { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.music-sound {
  width: 34px; height: 34px;
  flex: 0 0 34px;
  display: grid; place-items: center;
  font-size: 15px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--glass);
  cursor: pointer;
  transition: transform .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
}
.music-sound:hover { background: var(--glass-2); transform: scale(1.1); box-shadow: 0 6px 16px -6px var(--glow); }
.music-sound:active { transform: scale(.92); }
.music-sound.off { opacity: .55; border-color: rgba(255, 93, 115, .55); }
.music-sound.off:hover { border-color: var(--danger); }
.music-now {
  display: flex; align-items: center; gap: 12px;
  margin: 8px 16px 0;
  padding: 10px 12px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--glass);
}
.mn-ico { font-size: 22px; filter: drop-shadow(0 0 8px var(--glow)); }
.mn-name { font-size: 13.5px; font-weight: 700; }
.mn-status { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.music-viz {
  flex: 0 0 74px;
  margin: 10px 16px 4px;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: rgba(6, 10, 20, .5);
}
.music-viz span {
  width: 7px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 10px var(--glow);
  height: 18%;
  transition: height .18s ease;
}
.app-music.playing .music-viz span { animation: eqBar 1s ease-in-out infinite alternate; }
.app-music.playing .music-viz span:nth-child(2n) { animation-duration: .8s; animation-delay: -.2s; }
.app-music.playing .music-viz span:nth-child(3n) { animation-duration: 1.15s; animation-delay: -.5s; }
.app-music.playing .music-viz span:nth-child(5n) { animation-duration: .7s; animation-delay: -.35s; }
@keyframes eqBar {
  from { height: 14%; }
  to   { height: 96%; }
}
.music-progress {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 16px;
  font-size: 11px; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.music-progress .mp-bar { flex: 1; height: 4px; border-radius: 3px; background: var(--glass-2); overflow: hidden; }
.music-progress .mp-bar i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 8px var(--glow);
  transition: width .2s linear;
}
.music-controls {
  display: flex; align-items: center; justify-content: center;
  gap: 14px;
  padding: 8px 16px;
}
.mc-btn {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  font-size: 17px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--glass);
  cursor: pointer;
  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
}
.mc-btn:hover { background: var(--glass-2); transform: scale(1.1); box-shadow: 0 6px 16px -6px var(--glow); }
.mc-btn:active { transform: scale(.92); }
.mc-btn.play {
  width: 54px; height: 54px;
  font-size: 21px;
  border-color: transparent;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 10px 24px -8px var(--glow);
}
.music-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 12px 14px;
  display: flex; flex-direction: column;
  gap: 5px;
}
.m-track {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: background .13s ease, border-color .13s ease;
}
.m-track:hover { background: var(--glass-2); }
.m-track.active { background: var(--glass-2); border-color: var(--accent); }
.m-track .mt-ico { font-size: 17px; }
.m-track .mt-name { flex: 1; font-size: 12.5px; font-weight: 600; text-align: left; }
.m-track .mt-artist { font-size: 11px; color: var(--text-dim); }

/* ─── Приложение: Крестики-нолики ─── */
.app-ttt {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
  padding: 14px 16px;
  gap: 12px;
  background: rgba(8, 10, 20, .38);
}
.ttt-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap;
}
.ttt-modes {
  display: flex; gap: 6px;
  padding: 3px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--glass);
}
.ttt-mode {
  border: none; background: transparent;
  color: var(--text-dim);
  font: inherit; font-size: 12px;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .14s ease, color .14s ease, box-shadow .14s ease;
}
.ttt-mode:hover { color: var(--text); }
.ttt-mode.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: 0 6px 16px -6px var(--glow);
}
.ttt-score {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.ttt-score b { color: var(--text); font-size: 13px; }
.tts-x b { color: #ff5d73; }
.tts-o b { color: #38bdf8; }
.ttt-status {
  font-size: 13.5px;
  font-weight: 700;
  text-align: center;
  padding: 8px 10px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--glass);
  letter-spacing: .3px;
}
.ttt-board {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.ttt-cell {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--glass);
  color: var(--text);
  font-size: 34px;
  font-weight: 700;
  cursor: pointer;
  display: grid; place-items: center;
  transition: transform .12s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.ttt-cell:hover:not(:disabled) {
  background: var(--glass-2);
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px -10px var(--glow);
}
.ttt-cell:active:not(:disabled) { transform: scale(.94); }
.ttt-cell:disabled { cursor: default; opacity: .9; }
.ttt-cell.taken { cursor: default; }
.ttt-foot { display: flex; justify-content: center; }

/* ─── Приложение: Обои ─── */
.app-wall .wall-hint {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}
.app-wall .opt-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 13px; }
.app-wall .opt-preview { height: 96px; }
.app-wall .opt-name { font-size: 13px; }

/* ─── Центр уведомлений ─── */
#toasts {
  position: fixed;
  top: 16px; right: 16px;
  z-index: 8500;
  display: flex; flex-direction: column; gap: 10px;
  width: min(360px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  position: relative;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-2), var(--glass));
  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  box-shadow: 0 18px 44px -10px rgba(0, 0, 0, .55);
  overflow: hidden;
  cursor: default;
  opacity: 0;
  transform: translateX(120%);
  transition: transform .3s cubic-bezier(.2, .9, .3, 1.1), opacity .3s ease;
}
.toast.in { opacity: 1; transform: translateX(0); }
.toast.out { opacity: 0; transform: translateX(120%); transition: transform .25s ease, opacity .25s ease; }
.toast-ico { font-size: 20px; line-height: 1.3; filter: drop-shadow(0 0 8px var(--glow)); }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: 13px; font-weight: 700; }
.toast-text { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
.toast-close {
  border: none; background: transparent; color: var(--text-dim);
  font-size: 11px; cursor: pointer; padding: 2px; line-height: 1;
  opacity: 0; transition: opacity .15s ease;
}
.toast:hover .toast-close { opacity: 1; }
.toast-close:hover { color: var(--text); }
.toast-bar {
  position: absolute; left: 0; bottom: 0;
  height: 3px; width: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transform-origin: left;
  animation: toastBar linear forwards;
}
@keyframes toastBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
#notif-center {
  position: fixed;
  top: 14px; right: 14px;
  z-index: 8000;
  width: min(350px, calc(100vw - 28px));
  max-height: min(70vh, 520px);
  display: flex; flex-direction: column;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-2), var(--glass));
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  box-shadow: 0 26px 60px -12px rgba(0, 0, 0, .6);
  overflow: hidden;
  opacity: 0; pointer-events: none;
  transform: translateY(-16px) scale(.97);
  transform-origin: top right;
  transition: opacity .18s ease, transform .18s ease;
}
#notif-center.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.nc-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  font-size: 13px; font-weight: 700; letter-spacing: .4px;
  border-bottom: 1px solid var(--border);
}
.nc-clear {
  border: 1px solid var(--border);
  background: var(--glass);
  color: var(--text-dim);
  font: inherit; font-size: 11px;
  padding: 4px 10px; border-radius: 8px;
  cursor: pointer;
  transition: color .15s ease, border-color .15s ease, transform .15s ease;
}
.nc-clear:hover { color: var(--danger); border-color: var(--danger); transform: scale(1.04); }
.nc-list { overflow-y: auto; padding: 6px; }
.nc-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px;
  border-radius: 11px;
  border: 1px solid transparent;
  transition: background .12s ease, border-color .12s ease;
}
.nc-item:hover { background: rgba(255, 255, 255, .06); border-color: var(--border); }
.nc-item.is-clickable { cursor: pointer; }
.nc-ico { font-size: 17px; line-height: 1.4; }
.nc-body { flex: 1; min-width: 0; }
.nc-title { font-size: 12.5px; font-weight: 600; }
.nc-text { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
.nc-time { font-size: 10.5px; color: var(--text-dim); opacity: .75; margin-top: 4px; }
.nc-del {
  border: none; background: transparent; color: var(--text-dim);
  font-size: 10px; cursor: pointer; padding: 2px;
  opacity: 0; transition: opacity .15s ease;
}
.nc-item:hover .nc-del { opacity: 1; }
.nc-del:hover { color: var(--danger); }
.nc-empty { padding: 28px 14px; text-align: center; color: var(--text-dim); font-size: 12.5px; }
.dock-bell {
  position: relative;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  font-size: 19px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--glass);
  color: var(--text);
  cursor: pointer;
  transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), background .2s ease, box-shadow .2s ease;
}
.dock-bell:hover {
  transform: translateY(-4px);
  background: var(--glass-2);
  box-shadow: 0 10px 22px -6px var(--glow);
}
.dock-bell:active { transform: translateY(-2px) scale(.95); }
.dock-bell.has-unread .bell-ico { animation: bellRing 1.2s ease-in-out; }
@keyframes bellRing {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(14deg); }
  40% { transform: rotate(-12deg); }
  60% { transform: rotate(8deg); }
  80% { transform: rotate(-4deg); }
}
.notif-badge {
  position: absolute; top: -5px; right: -5px;
  min-width: 17px; height: 17px;
  display: grid; place-items: center;
  padding: 0 4px;
  border-radius: 9px;
  background: var(--danger);
  color: #fff;
  font-size: 10px; font-weight: 700;
  box-shadow: 0 0 10px rgba(255, 93, 115, .6);
}

/* ─── Слой «Матрицы» ─── */
#matrix-layer {
  position: fixed; inset: 0;
  z-index: 9500;
  width: 100vw; height: 100vh;
  background: rgba(2, 6, 4, .92);
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
#matrix-layer.on { opacity: 1; pointer-events: auto; }

/* ═══════════════ НОВЫЕ ПРИЛОЖЕНИЯ ═══════════════ */

/* ── Змейка ── */
.app-snake { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.snake-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.snake-stat { font-size: 13px; color: var(--text-dim); }
.snake-stat b { color: var(--text); font-variant-numeric: tabular-nums; }
.snake-wrap {
  position: relative;
  flex: 1; min-height: 0;
  display: grid; place-items: center;
  padding: 12px;
}
.snake-wrap canvas {
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(6, 10, 20, .55);
  box-shadow: inset 0 0 40px rgba(0,0,0,.35);
  max-width: 100%; max-height: 100%;
  outline: none;
}
.snake-overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center; gap: 12px;
  background: rgba(6, 8, 18, .72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 14px;
}
.snake-overlay[hidden] { display: none; }
.snake-over-msg { font-size: 20px; font-weight: 700; color: var(--accent-2); text-shadow: 0 0 18px var(--glow); }
.snake-hint, .pong-hint, .g2048-hint, .ms-hint, .pt-hint {
  padding: 8px 14px;
  font-size: 11px; color: var(--text-dim);
  border-top: 1px solid var(--border);
}

/* ── Сапёр ── */
.app-ms { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ms-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.ms-modes { display: flex; gap: 6px; }
.ms-mode { padding: 5px 11px; font-size: 11.5px; border-radius: 9px; }
.ms-mode.active { background: var(--glow); border-color: var(--accent); }
.ms-meta { display: flex; align-items: center; gap: 10px; }
.ms-chip {
  font-size: 12px; color: var(--text-dim);
  padding: 5px 10px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--glass);
  font-variant-numeric: tabular-nums;
}
.ms-chip b { color: var(--text); }
.ms-face {
  width: 34px; height: 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--glass);
  font-size: 17px;
  display: grid; place-items: center;
  transition: transform .15s ease, background .15s ease;
}
.ms-face:hover { transform: scale(1.1); background: var(--glass-2); }
.ms-board {
  --ms-cell: 30px;
  flex: 1; min-height: 0;
  display: grid;
  gap: 3px;
  align-content: start;
  justify-content: center;
  padding: 12px;
  overflow: auto;
}
.ms-cell {
  width: var(--ms-cell); height: var(--ms-cell);
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--glass);
  font-size: calc(var(--ms-cell) * .52);
  font-weight: 700;
  line-height: 1;
  display: grid; place-items: center;
  padding: 0;
  transition: background .1s ease, transform .1s ease;
}
.ms-cell:hover { background: var(--glass-2); }
.ms-cell:active { transform: scale(.92); }
.ms-cell.rev { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.05); }
.ms-cell.flag { font-size: calc(var(--ms-cell) * .55); }
.ms-cell.m1 { color: #60a5fa; }
.ms-cell.m2 { color: #4ade80; }
.ms-cell.m3 { color: #f87171; }

/* ── Рисовалка ── */
.app-paint { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.pt-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.pt-palette { display: flex; gap: 5px; }
.pt-swatch {
  width: 24px; height: 24px;
  border-radius: 7px;
  border: 2px solid transparent;
  outline: 1px solid rgba(255,255,255,.18);
  transition: transform .12s ease, border-color .12s ease;
}
.pt-swatch:hover { transform: scale(1.18); }
.pt-swatch.active { border-color: var(--accent-2); box-shadow: 0 0 0 2px var(--glow); }
.pt-size { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
.pt-size input[type="range"] { width: 90px; accent-color: var(--accent); }
#pt-eraser.on { border-color: var(--accent-2); color: var(--accent-2); }
.pt-wrap {
  flex: 1; min-height: 0;
  display: grid; place-items: center;
  padding: 10px;
  overflow: hidden;
}
.pt-wrap canvas {
  max-width: 100%; max-height: 100%;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
  cursor: crosshair;
  touch-action: none;
}

/* ── 2048 ── */
.app-g2048 { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.g2048-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.g2048-logo {
  font-size: 20px; font-weight: 800; letter-spacing: 1px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.g2048-stats { display: flex; gap: 8px; }
.g2048-chip {
  display: flex; flex-direction: column; align-items: center;
  padding: 4px 12px;
  border-radius: 10px;
  border: 1px solid var(--border); background: var(--glass);
  font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px;
}
.g2048-chip b { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
.g2048-wrap {
  position: relative;
  flex: 1; min-height: 0;
  display: grid; place-items: center;
  padding: 12px;
}
.g2048-banner {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 3;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px; font-weight: 700; color: #1e293b;
  background: linear-gradient(135deg, #facc15, #f97316);
  box-shadow: 0 8px 24px -8px rgba(250, 204, 21, .6);
}
.g2048-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: min(320px, 100%);
  padding: 8px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(6, 10, 20, .5);
  box-shadow: inset 0 0 40px rgba(0,0,0,.3);
}
.g2048-cell {
  aspect-ratio: 1;
  border-radius: 10px;
  display: grid; place-items: center;
  font-size: 26px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  animation: tileIn .14s ease;
}
@keyframes tileIn { from { transform: scale(.6); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.g2048-cell.win { box-shadow: 0 0 18px rgba(250, 204, 21, .55); }
.g2048-overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center; gap: 12px;
  background: rgba(6, 8, 18, .72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 14px;
  z-index: 2;
}
.g2048-overlay[hidden] { display: none; }
.g2048-over-msg { font-size: 20px; font-weight: 700; color: var(--accent-2); text-shadow: 0 0 18px var(--glow); }

/* ── Пинг-понг ── */
.app-pong { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.pong-bar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.pong-score { font-size: 13px; color: var(--text-dim); }
.pong-score b { color: var(--text); font-variant-numeric: tabular-nums; font-size: 15px; }
.pong-wrap {
  position: relative;
  flex: 1; min-height: 0;
  display: grid; place-items: center;
  padding: 12px;
}
.pong-wrap canvas {
  width: 100%; max-height: 100%;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(6, 10, 20, .55);
  box-shadow: inset 0 0 40px rgba(0,0,0,.35);
  touch-action: none;
}
.pong-overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center; gap: 12px;
  background: rgba(6, 8, 18, .72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 14px;
  z-index: 2;
}
.pong-overlay[hidden] { display: none; }
.pong-over-msg { font-size: 22px; font-weight: 700; color: var(--accent-2); text-shadow: 0 0 18px var(--glow); text-align: center; padding: 0 20px; }

/* ── Редактор ── */
.app-editor { display: flex; flex-direction: column; height: 100%; min-height: 0; position: relative; }
.ed-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.ed-name {
  flex: 1; min-width: 140px;
  background: transparent; border: none; outline: none;
  border-bottom: 1px solid transparent;
  color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px;
  font-family: var(--mono);
  transition: border-color .15s ease;
}
.ed-name:focus { border-color: var(--accent); }
.ed-body {
  flex: 1; min-height: 0;
  resize: none; border: none; outline: none;
  background: transparent; color: var(--text);
  font-family: var(--mono); font-size: 13.5px; line-height: 1.7;
  padding: 14px 16px;
  white-space: pre;
}
.ed-status {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 14px;
  font-size: 11px; color: var(--text-dim);
  font-family: var(--mono);
  border-top: 1px solid var(--border);
}
.ed-modal {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(6, 8, 18, .55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 5;
}
.ed-modal[hidden] { display: none; }
.ed-modal-box {
  display: flex; flex-direction: column; gap: 10px;
  width: min(340px, 90%);
  max-height: 70%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: linear-gradient(170deg, var(--glass-3), var(--glass));
  box-shadow: var(--shadow);
}
.ed-modal-title { font-size: 13px; font-weight: 700; }
.ed-modal-list {
  flex: 1; min-height: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 5px;
}
.ed-file {
  text-align: left;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid transparent;
  font-size: 12.5px;
  font-family: var(--mono);
  transition: background .12s ease, border-color .12s ease;
}
.ed-file:hover { background: var(--glass-2); border-color: var(--border); }
.ed-empty { font-size: 12.5px; color: var(--text-dim); padding: 20px 0; text-align: center; }

/* ── Текстовый режим браузера ── */
.br-textmode {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--glass-3);
}
.br-textmode-head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.br-textmode-title {
  flex: 1;
  font-family: var(--mono); font-size: 11.5px;
  color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.br-textmode-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 18px 22px;
  font-size: 13.5px; line-height: 1.7;
  color: var(--text);
}
.br-textmode-body h1, .br-textmode-body h2, .br-textmode-body h3,
.br-textmode-body h4, .br-textmode-body h5, .br-textmode-body h6 {
  margin: 14px 0 6px; line-height: 1.3;
}
.br-textmode-body h1 { font-size: 22px; }
.br-textmode-body h2 { font-size: 19px; }
.br-textmode-body h3 { font-size: 16px; }
.br-textmode-body p { margin: 8px 0; }
.br-textmode-body a { color: var(--accent-2); text-decoration: underline; text-underline-offset: 2px; }
.br-textmode-body code {
  font-family: var(--mono); font-size: 12px;
  background: var(--glass-2);
  padding: 1px 5px; border-radius: 5px;
}
.br-textmode-body blockquote {
  margin: 10px 0; padding: 6px 14px;
  border-left: 3px solid var(--accent);
  background: var(--glass);
  border-radius: 0 8px 8px 0;
  color: var(--text-dim);
}
.br-textmode-body ul { margin: 8px 0 8px 20px; }
.br-textmode-body li { margin: 3px 0; }
.br-textmode-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.br-textmode-load, .br-textmode-err { text-align: center; padding: 40px 0; color: var(--text-dim); }
.br-textmode-err { color: var(--danger); }

/* ─────────── Улучшения дизайна ─────────── */
* { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.win-header {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
}
.window.is-focused .win-header {
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 14%, transparent), transparent);
}
.d-icon { animation: diIn .4s ease backwards; }
.d-icon:nth-child(2) { animation-delay: .03s; }
.d-icon:nth-child(3) { animation-delay: .06s; }
.d-icon:nth-child(4) { animation-delay: .09s; }
.d-icon:nth-child(5) { animation-delay: .12s; }
.d-icon:nth-child(6) { animation-delay: .15s; }
.d-icon:nth-child(7) { animation-delay: .18s; }
.d-icon:nth-child(8) { animation-delay: .21s; }
.d-icon:nth-child(9) { animation-delay: .24s; }
.d-icon:nth-child(10) { animation-delay: .27s; }
.d-icon:nth-child(11) { animation-delay: .3s; }
.d-icon:nth-child(12) { animation-delay: .33s; }
.d-icon:nth-child(13) { animation-delay: .36s; }
.d-icon:nth-child(14) { animation-delay: .39s; }
.d-icon:nth-child(15) { animation-delay: .42s; }
.d-icon:nth-child(16) { animation-delay: .45s; }
.d-icon:nth-child(17) { animation-delay: .48s; }
@keyframes diIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════ APPLE-STYLE POLISH ═══════════════ */

/* Типографика как в macOS */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
    'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  letter-spacing: .1px;
}

/* Верхняя панель меню */
#menubar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 27px;
  z-index: 6000;
  display: flex; align-items: center; gap: 2px;
  padding: 0 10px;
  font-size: 12px;
  color: var(--text);
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  backdrop-filter: blur(26px) saturate(180%);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  border-bottom: 1px solid var(--border);
  user-select: none;
  -webkit-user-select: none;
}
.mb-item {
  display: inline-flex; align-items: center;
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text);
  transition: background .12s ease;
}
.mb-item:hover, .mb-item.active { background: rgba(255,255,255,.16); }
.mb-logo {
  font-size: 15px;
  color: var(--accent);
  text-shadow: 0 0 10px var(--glow);
  padding: 2px 8px;
}
.mb-brand {
  font-weight: 700;
  letter-spacing: .4px;
  padding: 0 10px 0 4px;
  opacity: .92;
}
.mb-sep {
  width: 1px; height: 15px;
  background: var(--border);
  margin: 0 8px;
}
.mb-current {
  flex: 1;
  text-align: center;
  font-weight: 600;
  opacity: .8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 0 10px;
}
.mb-right { display: flex; align-items: center; }
.mb-menu {
  position: absolute; top: 30px;
  min-width: 220px;
  padding: 5px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: linear-gradient(175deg, var(--glass-3), var(--glass));
  backdrop-filter: blur(34px) saturate(180%);
  -webkit-backdrop-filter: blur(34px) saturate(180%);
  box-shadow: 0 22px 50px -14px rgba(0,0,0,.65);
  display: none;
  flex-direction: column; gap: 1px;
}
#mb-menu-apps { left: 12px; }
#mb-menu-system { right: 12px; }
.mb-menu.show { display: flex; animation: mbIn .14s ease; }
@keyframes mbIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.mb-item-row {
  display: flex; align-items: center; gap: 9px;
  width: 100%;
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 12.5px;
  text-align: left;
  color: var(--text);
  transition: background .1s ease;
}
.mb-item-row:hover { background: var(--glow); }
.mb-row-ico { width: 18px; text-align: center; font-size: 13px; }
.mb-sep-row { height: 1px; background: var(--border); margin: 4px 8px; }

/* Окна: «светофор» как в macOS */
.window {
  border-radius: 14px;
  box-shadow: 0 26px 70px -18px rgba(0,0,0,.6);
}
.window.is-focused {
  border-color: rgba(255,255,255,.32);
  box-shadow:
    0 0 0 1px var(--glow),
    0 0 46px -8px var(--glow),
    0 34px 80px -14px rgba(0,0,0,.65);
}
.win-header {
  flex: 0 0 38px;
  padding: 0 10px 0 13px;
  gap: 10px;
}
.win-controls {
  display: flex; align-items: center; gap: 8px;
  padding-right: 2px;
  flex: 0 0 auto;
}
.win-ctl {
  width: 12px; height: 12px;
  border-radius: 50%;
  position: relative;
  display: grid; place-items: center;
  font-size: 9px; line-height: 1;
  color: rgba(0,0,0,.6);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.4), 0 1px 2px rgba(0,0,0,.4);
  transition: transform .14s cubic-bezier(.34,1.56,.64,1), filter .12s ease;
}
.win-ctl.close { background: linear-gradient(180deg, #ff6a5f, #e0443c); }
.win-ctl.min  { background: linear-gradient(180deg, #ffd23f, #efad1f); }
.win-ctl.max  { background: linear-gradient(180deg, #5adf5e, #2ea83a); }
.win-ctl:hover { transform: scale(1.18); filter: brightness(1.08); }
.win-ctl:active { transform: scale(.9); }
.win-ctl::after { content: ''; opacity: 0; transition: opacity .12s ease; font-weight: 800; }
.win-ctl.close::after { content: '×'; font-size: 11px; }
.win-ctl.min::after  { content: '–'; font-size: 11px; }
.win-ctl.max::after  { content: '+'; font-size: 10px; }
.win-controls:hover .win-ctl::after { opacity: 1; }
.win-title { font-size: 13px; letter-spacing: .2px; }

/* Иконки рабочего стола: «сквирлы» как в macOS */
.d-icon .di-emoji {
  width: 58px; height: 58px;
  display: grid; place-items: center;
  font-size: 29px;
  border-radius: 15px;
  background: linear-gradient(135deg, #7c8cff, #4f5bd5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -8px rgba(0,0,0,.55);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
}
.d-icon:hover .di-emoji {
  transform: translateY(-4px) scale(1.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 16px 30px -10px rgba(0,0,0,.6);
}
.d-icon .di-name {
  font-size: 11.5px;
  letter-spacing: .2px;
  text-shadow: 0 1px 4px rgba(0,0,0,.75);
}
.d-icon.selected {
  background: rgba(255,255,255,.1);
  border-color: rgba(255,255,255,.35);
}

/* Градиенты приложений (стол + меню «Пуск») */
.d-icon[data-app="notes"] .di-emoji, .sm-app[data-app="notes"] .sa-ico { background: linear-gradient(135deg, #ffd86b, #ff9a3d); }
.d-icon[data-app="terminal"] .di-emoji, .sm-app[data-app="terminal"] .sa-ico { background: linear-gradient(135deg, #2dd4bf, #0f766e); }
.d-icon[data-app="calculator"] .di-emoji, .sm-app[data-app="calculator"] .sa-ico { background: linear-gradient(135deg, #f9a8d4, #db2777); }
.d-icon[data-app="settings"] .di-emoji, .sm-app[data-app="settings"] .sa-ico { background: linear-gradient(135deg, #d4d4d8, #737373); }
.d-icon[data-app="files"] .di-emoji, .sm-app[data-app="files"] .sa-ico { background: linear-gradient(135deg, #7dd3fc, #2563eb); }
.d-icon[data-app="music"] .di-emoji, .sm-app[data-app="music"] .sa-ico { background: linear-gradient(135deg, #fda4af, #e11d48); }
.d-icon[data-app="calendar"] .di-emoji, .sm-app[data-app="calendar"] .sa-ico { background: linear-gradient(135deg, #ffffff, #cbd5e1); }
.d-icon[data-app="browser"] .di-emoji, .sm-app[data-app="browser"] .sa-ico { background: linear-gradient(135deg, #38bdf8, #0284c7); }
.d-icon[data-app="tictactoe"] .di-emoji, .sm-app[data-app="tictactoe"] .sa-ico { background: linear-gradient(135deg, #c4b5fd, #7c3aed); }
.d-icon[data-app="wallpaper"] .di-emoji, .sm-app[data-app="wallpaper"] .sa-ico { background: linear-gradient(135deg, #6ee7b7, #059669); }
.d-icon[data-app="about"] .di-emoji, .sm-app[data-app="about"] .sa-ico { background: linear-gradient(135deg, #94a3b8, #475569); }
.d-icon[data-app="snake"] .di-emoji, .sm-app[data-app="snake"] .sa-ico { background: linear-gradient(135deg, #86efac, #16a34a); }
.d-icon[data-app="minesweeper"] .di-emoji, .sm-app[data-app="minesweeper"] .sa-ico { background: linear-gradient(135deg, #fca5a5, #b91c1c); }
.d-icon[data-app="paint"] .di-emoji, .sm-app[data-app="paint"] .sa-ico { background: linear-gradient(135deg, #fdba74, #ea580c); }
.d-icon[data-app="game2048"] .di-emoji, .sm-app[data-app="game2048"] .sa-ico { background: linear-gradient(135deg, #fcd34d, #d97706); }
.d-icon[data-app="pong"] .di-emoji, .sm-app[data-app="pong"] .sa-ico { background: linear-gradient(135deg, #67e8f9, #0e7490); }
.d-icon[data-app="editor"] .di-emoji, .sm-app[data-app="editor"] .sa-ico { background: linear-gradient(135deg, #d8b4fe, #7e22ce); }

/* Меню «Пуск»: плитки как в Launchpad */
.sm-app .sa-ico {
  width: 50px; height: 50px;
  display: grid; place-items: center;
  font-size: 24px;
  border-radius: 13px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 8px 18px -8px rgba(0,0,0,.55);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
}
.sm-app:hover .sa-ico {
  transform: translateY(-3px) scale(1.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 14px 26px -10px rgba(0,0,0,.6);
}
.sm-app .sa-name { font-size: 11px; font-weight: 500; letter-spacing: .1px; }

/* Док: стеклянная подсветка и «прыжок» */
#dock::before {
  content: '';
  position: absolute; top: 0; left: 14px; right: 14px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  opacity: .8;
}
.dock-icon {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 8px 20px -8px rgba(0,0,0,.5);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, background .22s ease;
}
.dock-icon:hover {
  transform: translateY(-10px) scale(1.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 16px 30px -10px var(--glow);
}
.dock-icon:active { transform: translateY(-5px) scale(1.06); }

/* Кнопки и инпуты */
.fbtn { border-radius: 8px; font-weight: 600; letter-spacing: .2px; }
input[type="range"] { accent-color: var(--accent); }

/* Экран загрузки */
.boot-logo {
  font-size: 72px;
  text-shadow: 0 0 40px var(--glow), 0 0 90px var(--glow);
}
.boot-title { letter-spacing: 14px; text-indent: 14px; font-weight: 600; }
.boot-bar { width: 200px; height: 5px; border-radius: 4px; }
.boot-hint { font-size: 11px; letter-spacing: 1.5px; }

/* Уважение к prefers-reduced-motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
